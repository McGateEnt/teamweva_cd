name: Update Deployment

on:
  repository_dispatch:
    types:
      - update-deployment
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag to deploy (e.g. commit SHA or 'latest')"
        required: true
        default: "latest"

permissions:
  contents: write

jobs:
  update-deployment:
    runs-on: ubuntu-latest

    env:
      IMAGE_TAG: ${{ github.event.client_payload.image_tag || github.event.inputs.image_tag }}
      IMAGE_REGISTRY: mcgatehub

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      # ============================================================
      # VALIDATE PAYLOAD
      # ============================================================

      - name: Validate deployment payload
        run: |
          set -e

          if [ -z "$IMAGE_TAG" ]; then
            echo "ERROR: image_tag was not provided."
            exit 1
          fi

          echo "=========================================="
          echo "Deployment payload"
          echo "=========================================="
          echo "Image registry: $IMAGE_REGISTRY"
          echo "Image tag:      $IMAGE_TAG"
          echo "=========================================="

      # ============================================================
      # VALIDATE MANIFEST
      # ============================================================

      - name: Validate deployment manifest
        run: |
          set -e

          if [ ! -f "teamweva.yaml" ]; then
            echo "ERROR: teamweva.yaml was not found."
            exit 1
          fi

          echo "Deployment manifest found."

      # ============================================================
      # SHOW CURRENT IMAGES
      # ============================================================

      - name: Show current deployment images
        run: |
          echo "=========================================="
          echo "Images before update"
          echo "=========================================="

          grep -nE '^[[:space:]]*image:' teamweva.yaml || true

      # ============================================================
      # UPDATE IMAGES
      # ============================================================

      - name: Update deployment images
        run: |
          set -e

          echo "=========================================="
          echo "Updating deployment images"
          echo "=========================================="

          echo "Registry: $IMAGE_REGISTRY"
          echo "Tag:      $IMAGE_TAG"

          # Update every mcgatehub image while preserving
          # the image repository name (e.g. mcgatehub/teamweva:TAG).
          sed -i -E \
            "s|(^[[:space:]]*image:[[:space:]]*${IMAGE_REGISTRY}/[^:[:space:]]+):[^[:space:]]+|\1:${IMAGE_TAG}|g" \
            teamweva.yaml

          echo ""
          echo "Images after update:"
          grep -nE '^[[:space:]]*image:' teamweva.yaml || true

      # ============================================================
      # VERIFY CHANGES
      # ============================================================

      - name: Verify changes
        run: |
          set -e

          echo "=========================================="
          echo "Checking deployment changes"
          echo "=========================================="

          git diff -- teamweva.yaml

          if git diff --quiet -- teamweva.yaml; then
            echo ""
            echo "Notice: Deployment image was already up to date with tag ${IMAGE_TAG}."
          else
            echo ""
            echo "Deployment manifest was successfully modified."
          fi

      # ============================================================
      # VERIFY IMAGE TAGS
      # ============================================================

      - name: Verify image tags
        run: |
          set -e

          echo "=========================================="
          echo "Verifying image tags"
          echo "=========================================="

          images=$(grep -E '^[[:space:]]*image:[[:space:]]*' teamweva.yaml |
            sed -E 's/^[[:space:]]*image:[[:space:]]*//')

          while IFS= read -r image; do

            [ -z "$image" ] && continue

            if [[ "$image" == "${IMAGE_REGISTRY}/"* ]]; then

              if [[ "$image" != *":${IMAGE_TAG}" ]]; then
                echo ""
                echo "ERROR: Image does not have expected tag:"
                echo "$image"
                echo ""
                echo "Expected tag:"
                echo "$IMAGE_TAG"
                exit 1
              fi

              echo "OK: $image"
            fi

          done <<< "$images"

          echo ""
          echo "All ${IMAGE_REGISTRY} images have the expected tag."

      # ============================================================
      # COMMIT CHANGES
      # ============================================================

      - name: Commit changes
        run: |
          set -e

          git config user.name "GitHub Actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add teamweva.yaml

          if git diff --staged --quiet; then
            echo "No changes staged for commit."
          else
            git commit -m "Update deployment images to ${IMAGE_TAG}"
          fi

      # ============================================================
      # PUSH CHANGES (TRIGGERS ARGOCD)
      # ============================================================

      - name: Push changes
        run: |
          set -e

          if git diff --staged --quiet && git diff origin/main..HEAD --quiet 2>/dev/null; then
            echo "No commits to push."
          else
            git push origin main
          fi

          echo ""
          echo "=========================================="
          echo "Deployment manifest pushed successfully."
          echo "ArgoCD will automatically reconcile and deploy to Kubernetes."
          echo "=========================================="
